
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.mes.bc'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
        consumerProguardFiles 'consumer-rules.pro'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.TRaiLE-web'
                artifactId = 'bubblechat'
                version = '1.0.0'
            }
        }
    }
}
